version: 1

profiles:
  plugin-staleness-audit:
    gates:
      - id: staleness-audit
        run: python3 scripts/plugin_staleness_audit.py
        timeout: 5m
        allow_failure: false
        decision_on_failure: fail

  triage:
    parallel: false
    gates:
      - id: file-size
        run: |
          fail=0
          for f in $(git diff --name-only --diff-filter=d main...HEAD); do
            [ -f "$f" ] || continue
            lines=$(wc -l < "$f")
            if [ "$lines" -gt 1000 ]; then
              echo "FAIL: $f has $lines lines (limit 1000)"
              fail=1
            fi
          done
          exit $fail
        timeout: 2m
      - id: ruff
        run: uv run ruff check .
        timeout: 5m
      - id: test
        run: uv run pytest
        timeout: 10m

  catalog-audit:
    gates:
      - id: catalog-seat-audit
        run: uv run python scripts/catalog_seat_audit.py --out .foundry/catalog-audit-report.md
        timeout: 5m
        allow_failure: true
        decision_on_failure: warn

schedules:
  plugin-staleness-audit-weekly:
    profile: plugin-staleness-audit
    cron: '0 6 * * 1'
  triage-scott-cc:
    profile: triage
    cron: '0 11 * * 2'
  catalog-audit-monthly:
    profile: catalog-audit
    cron: '0 6 1 * *'   # 06:00 UTC on the 1st of each month

integrations:
  beads:
    on_needs_human: true
