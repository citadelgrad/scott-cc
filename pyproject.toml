[project]
name = "scott-cc-contracts"
version = "0.0.0"
requires-python = ">=3.12,<3.15"

[tool.uv]
package = false

[tool.ty.environment]
python-version = "3.12"

[dependency-groups]
dev = [
    "hypothesis>=6,<7",
    "jsonschema>=4.26,<5",
    "pytest>=9.1,<10",
    "pytest-asyncio>=1,<2",
    "python-dotenv>=1,<2",
    "pyyaml>=6,<7",
    "ruff>=0.15,<0.16",
]
